name: cosmos-probe-191038

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  egress-probe:
    name: egress-probe
    runs-on: fixed-egress-2c-8g
    steps:
      - name: read-only egress and reachability probe
        continue-on-error: true
        run: |
          set -u
          echo "=== EGRESS ==="
          echo "ifconfig.me: $(curl -sS -m 10 https://ifconfig.me || true)"
          echo "ipify: $(curl -sS -m 10 https://api.ipify.org || true)"
          echo "=== SIGNATAIRE 9000 (read-only) ==="
          for ip in 3.255.13.221 54.216.229.51 52.215.179.5 108.129.5.197 52.212.240.227 52.48.66.163; do
            echo "--- $ip"
            echo "upcheck: $(curl -sS -m 6 -w ' [http=%{http_code} t=%{time_total}]' http://$ip:9000/upcheck 2>&1 || true)"
            echo "eth_accounts: $(curl -sS -m 6 -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_accounts","params":[]}' http://$ip:9000/ 2>&1 || true)"
            echo "clientver: $(curl -sS -m 6 -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}' http://$ip:9000/ 2>&1 || true)"
          done
          echo "=== ERPC ==="
          echo "erpc: $(curl -sS -m 8 -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' https://erpc.kiln.fi/main/evm/1 2>&1 || true)"
          echo "=== ETH-API ==="
          echo "eth-api upcheck: $(curl -sS -m 8 -w ' [http=%{http_code}]' https://eth-api.mainnet.kiln.fi/upcheck 2>&1 || true)"
          echo "=== VAULT ==="
          echo "vault health: $(curl -sS -m 8 -w ' [http=%{http_code}]' https://vault.0x.kiln.fi:8200/v1/sys/health 2>&1 || true)"
          echo "=== INTERNAL 9000 ==="
          for ip in 10.40.5.90 10.40.81.197; do
            echo "--- $ip"
            echo "upcheck: $(curl -sS -m 5 -w ' [http=%{http_code} t=%{time_total}]' http://$ip:9000/upcheck 2>&1 || true)"
          done
          echo "=== DONE 191038 ==="
